name: Deploy Production

on:
  push:
    branches: [ "Production" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (shallow)
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ secrets.NODE_VERSION || '20' }}

      - name: Build
        run: |
          npm ci
          npm run build || echo "no build step"

      # Upload code to EC2 using SCP
      - name: Upload build via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "."
          target: ${{ secrets.PROD_DIR }}
          rm: true
          overwrite: true
          exclude: ".git,.github,node_modules"

      # SSH into EC2 and restart PM2
      - name: Install deps & restart PM2 on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ${{ secrets.PROD_DIR }}
            npm ci --omit=dev
            pm2 describe ntc-api-prod >/dev/null 2>&1 && pm2 reload ntc-api-prod || pm2 start "node src/server.js" --name ntc-api-prod --update-env --env production
            pm2 save
            # optional: verify site
            curl -I --max-time 5 https://your-domain.com || true
