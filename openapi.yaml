      responses:
        '200':
          description: Location history returned
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Last-Modified:
              $ref: '#/components/headers/LastModified'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LocationUpdate'
                  meta:
                    type: object
                    properties:
                      limit:
                        type: integer
                      since:
                        type: string
                        format: date-time
                      until:
                        type: string
                        format: date-time
                      bbox:
                        type: string
        '404':
          description: Bus not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
