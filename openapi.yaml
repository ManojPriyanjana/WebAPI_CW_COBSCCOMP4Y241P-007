  /stream/positions:
    get:
      tags: [Streaming]
      summary: Subscribe to live bus positions via Server-Sent Events
      operationId: streamPositions
      description: |-
        Opens a long-lived HTTP connection that emits `text/event-stream` messages whenever new bus
        location documents are inserted. Heartbeat comments are sent every 15 seconds.
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: Continue from a specific event id (client managed)
          schema:
            type: string
      security: []
      responses:
        '200':
          description: Stream opened successfully
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events payload (data lines containing `LocationUpdate` JSON)
        '503':
          description: Stream unavailable (e.g. MongoDB disconnected)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
