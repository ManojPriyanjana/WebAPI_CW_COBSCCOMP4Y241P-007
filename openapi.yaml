openapi: 3.1.0
info:
  title: National Transit Connect API
  version: 0.1.0
  summary: REST + SSE backend for bus routes, trips, live locations, and alerts.
  description: |-
    This document describes the HTTP and Server-Sent Events surfaces exposed by the
    National Transit Connect API. It covers authentication, pagination, conditional
    caching, rate limiting, and resource models for routes, buses, trips, alerts,
    and live bus location updates.
servers:
  - url: http://localhost:3000
    description: Local development server
  - url: https://api.example.com
    description: Placeholder production hostname
security:
  - bearerAuth: []
tags:
  - name: Health
    description: Service health probes
  - name: Auth
    description: Authentication and token lifecycle
  - name: Routes
    description: CRUD operations for transport routes
  - name: Buses
    description: CRUD operations and telemetry endpoints for buses
  - name: Trips
    description: Trip scheduling APIs
  - name: Alerts
    description: Passenger-facing service alerts
  - name: Streaming
    description: Live updates delivered via Server-Sent Events
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PageParam:
      name: page
      in: query
      description: 1-based page number. Defaults to 1 when omitted.
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitParam:
      name: limit
      in: query
      description: Page size. Defaults to 20. Maximum varies per resource (commonly 100).
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 20
    ServiceDateParam:
      name: serviceDate
      in: query
      description: >-
        Calendar date in YYYY-MM-DD interpreted in the service timezone (Asia/Colombo).
        When supplied, values are normalized to the corresponding start-of-day instant.
      schema:
        type: string
        format: date
      example: '2025-10-06'
    ServiceTimeParam:
      name: time
      in: query
      description: >-
        Local time in HH:mm (24h) interpreted in the service timezone (Asia/Colombo).
        Used together with serviceDate to compose precise instants.
      schema:
        type: string
        pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$'
      example: '07:30'
    SortParam:
      name: sort
      in: query
      description: "Sort expression supporting dotted fields and '-' prefix for descending order (e.g. `-updatedAt`)."
      schema:
        type: string
      example: "-updatedAt"
    FilterParam:
      name: filter
      in: query
      description: Deep object filter (e.g. `filter[name]=North`, `filter[status]=active`).
      style: deepObject
      explode: true
      schema:
        type: object
        additionalProperties:
          type: string
    IfNoneMatchHeader:
      name: If-None-Match
      in: header
      description: Provide the ETag from a previous response to leverage conditional caching (304 Not Modified when unchanged).
      schema:
        type: string
    IfModifiedSinceHeader:
      name: If-Modified-Since
      in: header
      description: Provide the Last-Modified value from a previous response to leverage conditional caching.
      schema:
        type: string
        format: date-time
  headers:
    ETag:
      description: Strong ETag representing the response entity. Reuse with `If-None-Match` on subsequent requests.
      schema:
        type: string
    LastModified:
      description: Timestamp identifying the last mutation of the resource collection or entity.
      schema:
        type: string
        format: date-time
    RateLimitLimit:
      description: Maximum requests permitted in the current window.
      schema:
        type: integer
    RateLimitRemaining:
      description: Requests remaining in the current window.
      schema:
        type: integer
    RateLimitReset:
      description: UNIX epoch seconds when the current window resets.
      schema:
        type: integer
        format: int64
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: integer
              format: int32
            message:
              type: string
            details:
              type: object
              additionalProperties: true
    Route:
      type: object
      properties:
        id:
          type: string
          description: MongoDB ObjectId of the route
          example: 651f8dd7f82f10065b4a8c90
        code:
          type: string
          example: RX01
        name:
          type: string
        provinceFrom:
          type: string
        provinceTo:
          type: string
        distanceKm:
          type: number
          format: float
          example: 180
        ownerId:
          type: string
          description: Owning operator's user id (for RBAC checks)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - code
        - name
        - provinceFrom
        - provinceTo
        - distanceKm
    PaginatedRouteList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Route'
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
      required:
        - data
        - page
        - limit
        - total
    Bus:
      type: object
      properties:
        id:
          type: string
          example: 6520a963fec7e5569cd4aa42
        regNo:
          type: string
          example: NB-5010
        operator:
          type: string
        capacity:
          type: integer
        status:
          type: string
          description: Operational status (e.g. active, maintenance)
        ownerId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - regNo
        - operator
        - capacity
    PaginatedBusList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Bus'
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
      required:
        - data
        - page
        - limit
        - total
    Trip:
      type: object
      properties:
        id:
          type: string
        routeId:
          type: string
        busId:
          type: string
        serviceDate:
          type: string
          format: date
        schedDepart:
          type: string
          format: date-time
        schedArrive:
          type: string
          format: date-time
        status:
          type: string
          description: Trip lifecycle status (scheduled, enroute, completed, cancelled)
        ownerId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - routeId
        - busId
        - serviceDate
        - schedDepart
        - schedArrive
    PaginatedTripList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Trip'
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
      required:
        - data
        - page
        - limit
        - total
    Alert:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        body:
          type: string
        type:
          type: string
          description: Audience or channel type (e.g. system, route-specific)
        severity:
          type: string
          enum: [info, warning, critical]
        routes:
          type: array
          items:
            type: string
          description: Route ids impacted by the alert
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - body
        - severity
    PaginatedAlertList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Alert'
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
      required:
        - data
        - page
        - limit
        - total
    LocationUpdate:
      type: object
      properties:
        id:
          type: string
        busId:
          type: string
        lat:
          type: number
          format: float
        lon:
          type: number
          format: float
        ts:
          type: string
          format: date-time
        speedKph:
          type: number
          format: float
        heading:
          type: number
          format: float
        accuracyM:
          type: number
          format: float
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - busId
        - lat
        - lon
        - ts
paths:
  /healthz:
    get:
      tags: [Health]
      summary: Basic liveness check
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Last-Modified:
              $ref: '#/components/headers/LastModified'
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
                required:
                  - status
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/register:
    post:
      tags: [Auth]
      summary: Register the initial admin or a commuter user
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                role:
                  type: string
                  description: Optional role assignment (admin only)
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  email:
                    type: string
                  role:
                    type: string
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate with email/password and receive JWTs
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Tokens issued
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
                required:
                  - accessToken
                  - refreshToken
        '400':
          description: Invalid credentials supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '423':
          description: Account locked or rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh an expired/expiring access token
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Refreshed access token
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                required:
                  - accessToken
        '400':
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke a refresh token
      operationId: logout
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Refresh token revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Refresh token missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/routes:
    get:
      tags: [Routes]
      summary: List routes with pagination and filtering
      operationId: listRoutes
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/FilterParam'
        - $ref: '#/components/parameters/IfNoneMatchHeader'
        - $ref: '#/components/parameters/IfModifiedSinceHeader'
      security: []
      responses:
        '200':
          description: Routes returned successfully
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Last-Modified:
              $ref: '#/components/headers/LastModified'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRouteList'
        '304':
          description: Not modified since last request
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Routes]
      summary: Create a new route
      operationId: createRoute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, provinceFrom, provinceTo, distanceKm]
              properties:
                code:
                  type: string
                name:
                  type: string
                provinceFrom:
                  type: string
                provinceTo:
                  type: string
                distanceKm:
                  type: number
                  format: float
                ownerId:
                  type: string
      responses:
        '201':
          description: Route created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Duplicate route code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/routes/by-code/{code}:
    get:
      tags: [Routes]
      summary: Retrieve a route by its short code
      operationId: getRouteByCode
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IfNoneMatchHeader'
        - $ref: '#/components/parameters/IfModifiedSinceHeader'
      security: []
      responses:
        '200':
          description: Route found
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Last-Modified:
              $ref: '#/components/headers/LastModified'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
        '404':
          description: Route not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/routes/{id}:
    get:
      tags: [Routes]
      summary: Retrieve a route by id
      operationId: getRoute
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IfNoneMatchHeader'
        - $ref: '#/components/parameters/IfModifiedSinceHeader'
      security: []
      responses:
        '200':
          description: Route found
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Last-Modified:
              $ref: '#/components/headers/LastModified'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
        '404':
          description: Route not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags: [Routes]
      summary: Update editable fields on a route
      operationId: updateRoute
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                provinceFrom:
                  type: string
                provinceTo:
                  type: string
                distanceKm:
                  type: number
                  format: float
      responses:
        '200':
          description: Route updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Route not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Routes]
      summary: Delete a route
      operationId: deleteRoute
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Route removed
        '404':
          description: Route not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/buses:
    get:
      tags: [Buses]
      summary: List buses with pagination and filtering
      operationId: listBuses
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/FilterParam'
        - $ref: '#/components/parameters/IfNoneMatchHeader'
        - $ref: '#/components/parameters/IfModifiedSinceHeader'
      security: []
      responses:
        '200':
          description: Buses returned successfully
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Last-Modified:
              $ref: '#/components/headers/LastModified'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBusList'
        '304':
          description: Not modified since last request
    post:
      tags: [Buses]
      summary: Register a new bus
      operationId: createBus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [regNo, operator, capacity]
              properties:
                regNo:
                  type: string
                operator:
                  type: string
                capacity:
                  type: integer
                ownerId:
                  type: string
      responses:
        '201':
          description: Bus created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bus'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Duplicate registration number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/buses/{id}:
    get:
      tags: [Buses]
      summary: Retrieve a bus by id
      operationId: getBus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IfNoneMatchHeader'
        - $ref: '#/components/parameters/IfModifiedSinceHeader'
      security: []
      responses:
        '200':
          description: Bus found
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Last-Modified:
              $ref: '#/components/headers/LastModified'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bus'
        '404':
          description: Bus not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags: [Buses]
      summary: Update a bus
      operationId: updateBus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                operator:
                  type: string
                capacity:
                  type: integer
                status:
                  type: string
                ownerId:
                  type: string
      responses:
        '200':
          description: Bus updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bus'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Bus not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Buses]
      summary: Delete a bus
      operationId: deleteBus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Bus removed
        '404':
          description: Bus not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/buses/{id}/locations:
    post:
      tags: [Buses]
      summary: Submit a live location sample
      operationId: createBusLocation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lon]
              properties:
                lat:
                  type: number
                  format: float
                lon:
                  type: number
                  format: float
                ts:
                  type: string
                  format: date-time
                speedKph:
                  type: number
                  format: float
                heading:
                  type: number
                  format: float
                accuracyM:
                  type: number
                  format: float
      responses:
        '202':
          description: Location accepted
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Bus not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/buses/{id}/locations/latest:
    get:
      tags: [Buses]
      summary: Retrieve the most recent location sample for a bus
      operationId: getLatestBusLocation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IfNoneMatchHeader'
        - $ref: '#/components/parameters/IfModifiedSinceHeader'
      security: []
      responses:
        '200':
          description: Latest location (or null when absent)
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Last-Modified:
              $ref: '#/components/headers/LastModified'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/LocationUpdate'
                      - type: 'null'
        '404':
          description: Bus not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/buses/{id}/locations/history:
    get:
      tags: [Buses]
      summary: Retrieve historic location samples
      operationId: getBusLocationHistory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: since
          in: query
          description: >-
            Only include samples captured at or after this timestamp. Accepts ISO 8601
            instants or service-local date/time strings (YYYY-MM-DD or HH:mm) interpreted in
            Asia/Colombo timezone.
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          description: >-
            Only include samples captured before this timestamp. Accepts ISO 8601 instants
            or service-local date/time strings (YYYY-MM-DD or HH:mm) interpreted in
            Asia/Colombo timezone.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          description: Maximum number of samples to return (default 500, max 1000)
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 500
        - name: bbox
          in: query
          description: Bounding box filter in `lon1,lat1,lon2,lat2` order
          schema:
            type: string
        - $ref: '#/components/parameters/IfNoneMatchHeader'
        - $ref: '#/components/parameters/IfModifiedSinceHeader'
